<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Extract Seal</title>
</head>
<body style="background: #333; color: #fff; font-family: sans-serif; padding: 20px;">
  <h2>Processing Seal Image...</h2>
  <canvas id="c"></canvas>
  <div id="status">Starting...</div>

  <script>
    const img = new Image();
    img.src = '/foca.jpg';
    img.onload = () => {
      const w = img.width;
      const h = img.height;
      const canvas = document.getElementById('c');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);

      const imgData = ctx.getImageData(0, 0, w, h);
      const data = imgData.data;

      // Sample background color from corners
      const bgR = data[0], bgG = data[1], bgB = data[2];
      console.log('Sampled BG:', bgR, bgG, bgB);

      // BFS flood fill from all border pixels
      const visited = new Uint8Array(w * h);
      const queue = [];

      function isOutline(r, g, b) {
        // Outline is dark brown: rgb around (54, 29, 21), luminance is low
        const lum = 0.299 * r + 0.587 * g + 0.114 * b;
        return lum < 115 || (r < 110 && g < 90 && b < 80);
      }

      function isBackgroundLike(r, g, b) {
        // Background is light cream/beige
        const lum = 0.299 * r + 0.587 * g + 0.114 * b;
        // Color distance to sampled bg
        const dr = r - bgR, dg = g - bgG, db = b - bgB;
        const dist = Math.sqrt(dr*dr + dg*dg + db*db);
        return dist < 65 || (lum > 180 && !isOutline(r, g, b));
      }

      // Add all 4 boundaries to queue
      for (let x = 0; x < w; x++) {
        queue.push(x, 0);
        visited[0 * w + x] = 1;
        queue.push(x, h - 1);
        visited[(h - 1) * w + x] = 1;
      }
      for (let y = 0; y < h; y++) {
        queue.push(0, y);
        visited[y * w + 0] = 1;
        queue.push(w - 1, y);
        visited[y * w + (w - 1)] = 1;
      }

      let qIdx = 0;
      while (qIdx < queue.length) {
        const cx = queue[qIdx++];
        const cy = queue[qIdx++];

        const neighbors = [
          [cx + 1, cy],
          [cx - 1, cy],
          [cx, cy + 1],
          [cx, cy - 1]
        ];

        for (let i = 0; i < neighbors.length; i++) {
          const nx = neighbors[i][0];
          const ny = neighbors[i][1];
          if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
            const idx = ny * w + nx;
            if (!visited[idx]) {
              const pIdx = idx * 4;
              const r = data[pIdx];
              const g = data[pIdx + 1];
              const b = data[pIdx + 2];
              if (!isOutline(r, g, b)) {
                visited[idx] = 1;
                queue.push(nx, ny);
              }
            }
          }
        }
      }

      // Mark all visited pixels as fully transparent
      let minX = w, maxX = 0, minY = h, maxY = 0;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const idx = y * w + x;
          const pIdx = idx * 4;
          if (visited[idx]) {
            data[pIdx + 3] = 0; // Transparent
          } else {
            // Non-transparent seal pixel
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }

      ctx.putImageData(imgData, 0, 0);

      // Now crop tightly around seal with padding
      const pad = 24;
      const cropX = Math.max(0, minX - pad);
      const cropY = Math.max(0, minY - pad);
      const cropW = Math.min(w - cropX, (maxX - minX) + pad * 2);
      const cropH = Math.min(h - cropY, (maxY - minY) + pad * 2);

      const croppedCanvas = document.createElement('canvas');
      croppedCanvas.width = cropW;
      croppedCanvas.height = cropH;
      const cCtx = croppedCanvas.getContext('2d');
      cCtx.drawImage(canvas, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

      const dataUrl = croppedCanvas.toDataURL('image/png');
      document.getElementById('status').innerText = `Cropped: ${cropW}x${cropH}, sending to server...`;

      fetch('/save-png', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: dataUrl })
      })
      .then(res => res.json())
      .then(res => {
        document.getElementById('status').innerText = 'SUCCESS! Saved foca-transparent.png (' + cropW + 'x' + cropH + ')';
        document.body.appendChild(croppedCanvas);
      })
      .catch(err => {
        document.getElementById('status').innerText = 'Error: ' + err.message;
      });
    };
  </script>
</body>
</html>
